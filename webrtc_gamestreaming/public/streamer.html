<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pixulse Streamer Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Press Start 2P', cursive;
     background: radial-gradient(circle, #c084fc, #6366f1, #111827);




      color: #00ffaa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 40px;
      color: #1c1917;
    }
.glow-on-hover {
    width: 200px;
    height: 50px;
    outline: none;
    color: #ffffff;
    background: linear-gradient(90deg, #ff007f, #5700ff);
    border: none;
    cursor: pointer;
    position: relative;
    z-index: 0;
    border-radius: 30px;
    font-size: 18px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    transition: transform 0.2s, background 0.5s;

    overflow: hidden;

}
.glow-on-hover:hover {

    transform: scale(1.1);
    animation: pulse 1.2s infinite alternate;
}

.glow-on-hover::before {
    content: "";
    position: absolute;
    top: -2px;
    left: -2px;
    width: calc(100% + 4px);
    height: calc(100% + 4px);
    background: linear-gradient(90deg, #ff007f, #01d2d9, #6619ff, #ff007f);
    background-size: 400%;
    z-index: -1;
    filter: blur(13px);
    animation: neon-glow 6s infinite linear;
    border-radius: 30px;
}
.glow-on-hover:active {
    transform: scale(0.98);
    background: #ff007f;
}
.pixel-btn {
    font-size: 18px;
    font-weight: bold;
    margin: 0px 0px 0px 0px;
    color: white;
    background: black;
    padding: 12px 30px;
    border: 4px solid white;
    cursor: pointer;
    text-transform: uppercase;
    transition: 0.3s;
    position: relative;
    font-family: 'Press Start 2P', cursive;
    image-rendering: pixelated;
}

.pixel-btn:hover {
    background: white;
    color: black;
    border-color: black;
}
@keyframes neon-glow {
    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}
    
  </style>
</head>
<body>
  <h1> Pixulse Cloud Streamer Panel</h1>
  <button onclick="setupStream()" class="pixel-btn glow-on-hover" type="button"
                    style="width: 400px;height: 60px; letter-spacing: 2px;">
                     Start Streaming
                </button>
  <p id="hostAgentStatus" style="font-size: 11px; margin-top: 28px; color: #1c1917;">
    Input agent: not connected
  </p>

  <script src="/config.js"></script>
  <script>
    const query = new URLSearchParams(window.location.search);
    const room = query.get('room') || query.get('game') || 'default';
    const agentPort = query.get('agentPort') || '9090';
    const agentToken = query.get('agentToken') || '';
    const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${wsProtocol}//${window.location.host}`);
    const rtcConfig = window.PIXULSE_CONFIG?.rtcConfig || {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' }
      ]
    };

    let stream;
    let hostAgent;
    let hostAgentReady = false;
    let hostAgentRetryTimer;
    const connections = {};
    const pendingViewers = new Set();
    const hostAgentStatus = document.getElementById('hostAgentStatus');

    async function setupStream() {
      try {
        connectHostAgent();
        stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });

        stream.getVideoTracks()[0].addEventListener('ended', () => {
          for (const id in connections) {
            connections[id].close();
          }
          pendingViewers.clear();
        });

        for (const id of pendingViewers) {
          await createViewerConnection(id);
        }
        pendingViewers.clear();
      } catch (err) {
        alert('Permission denied or no screen selected.');
      }
    }

    ws.addEventListener('open', () => {
      ws.send(JSON.stringify({ type: 'register', role: 'streamer', room }));
    });

    connectHostAgent();

    ws.addEventListener('message', async (event) => {
      const msg = JSON.parse(event.data);

      if (msg.type === 'viewer-connected') {
        if (!stream) {
          pendingViewers.add(msg.id);
          return;
        }

        await createViewerConnection(msg.id);
      }

      if (msg.type === 'viewer-disconnected' && connections[msg.id]) {
        connections[msg.id].close();
        delete connections[msg.id];
      }

      if (msg.type === 'answer' && msg.from && connections[msg.from]) {
        await connections[msg.from].setRemoteDescription(new RTCSessionDescription(msg.data));
      }

      if (msg.type === 'ice-candidate' && msg.from && connections[msg.from]) {
        await connections[msg.from].addIceCandidate(new RTCIceCandidate(msg.data));
      }
    });

    async function createViewerConnection(viewerId) {
      const pc = new RTCPeerConnection(rtcConfig);
      const inputChannel = pc.createDataChannel('pixulse-input');

      inputChannel.addEventListener('message', (event) => {
        forwardInputToAgent(viewerId, event.data);
      });

      inputChannel.addEventListener('open', () => {
        inputChannel.send(JSON.stringify({
          type: 'host-ready',
          room,
          inputAgentConnected: hostAgentReady
        }));
      });

      stream.getTracks().forEach(track => pc.addTrack(track, stream));

      pc.onicecandidate = e => {
        if (e.candidate) {
          ws.send(JSON.stringify({
            type: 'ice-candidate',
            data: e.candidate,
            to: viewerId
          }));
        }
      };

      pc.onconnectionstatechange = () => {
        if (['failed', 'closed', 'disconnected'].includes(pc.connectionState)) {
          delete connections[viewerId];
        }
      };

      connections[viewerId] = pc;

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      ws.send(JSON.stringify({
        type: 'offer',
        data: offer,
        to: viewerId
      }));
    }

    function connectHostAgent() {
      if (hostAgent && [WebSocket.OPEN, WebSocket.CONNECTING].includes(hostAgent.readyState)) return;

      hostAgentStatus.textContent = `Input agent: connecting on 127.0.0.1:${agentPort}`;
      hostAgentStatus.style.color = '#1c1917';
      hostAgent = new WebSocket(`ws://127.0.0.1:${agentPort}`);

      hostAgent.addEventListener('open', () => {
        clearTimeout(hostAgentRetryTimer);
        hostAgentReady = true;
        hostAgentStatus.textContent = 'Input agent: connected';
        hostAgentStatus.style.color = '#064e3b';
        hostAgent.send(JSON.stringify({
          type: 'auth',
          token: agentToken
        }));
      });

      hostAgent.addEventListener('close', () => {
        hostAgentReady = false;
        hostAgentStatus.textContent = 'Input agent: disconnected';
        hostAgentStatus.style.color = '#7f1d1d';
        scheduleHostAgentReconnect();
      });

      hostAgent.addEventListener('error', () => {
        hostAgentReady = false;
        hostAgentStatus.textContent = 'Input agent: unavailable. Start npm run input-agent on the host PC.';
        hostAgentStatus.style.color = '#7f1d1d';
      });
    }

    function scheduleHostAgentReconnect() {
      clearTimeout(hostAgentRetryTimer);
      hostAgentRetryTimer = setTimeout(connectHostAgent, 2500);
    }

    function forwardInputToAgent(viewerId, rawPayload) {
      if (!hostAgent || hostAgent.readyState !== WebSocket.OPEN) return;

      try {
        const input = JSON.parse(rawPayload);
        hostAgent.send(JSON.stringify({
          viewerId,
          ...input
        }));
      } catch (err) {
        console.warn('Invalid viewer input payload:', rawPayload);
      }
    }
  </script>
</body>
</html>
